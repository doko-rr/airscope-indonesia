# AirScope local MQTT broker configuration.
# Anonymous access is allowed only for local development.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

connection_messages true

sys_interval 10

max_packet_size 262144
max_inflight_messages 20
max_queued_messages 1000
