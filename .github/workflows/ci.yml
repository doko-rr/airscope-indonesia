name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck API
        run: pnpm --filter api typecheck

      - name: Typecheck Web
        run: pnpm --filter web typecheck

  api:
    name: API tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: file:./prisma/ci.db
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api prisma:generate

      - name: Apply database migrations
        run: pnpm --filter api db:migrate:deploy

      - name: Check migration status
        run: pnpm --filter api db:status

      - name: Run API unit tests
        run: pnpm --filter api test

      - name: Run API E2E tests
        run: pnpm --filter api test:e2e

      - name: Build API
        run: pnpm --filter api build

      - name: Clean temporary CI database
        if: always()
        run: |
          rm -f apps/api/prisma/ci.db
          rm -f apps/api/prisma/ci.db-journal
          rm -f apps/api/prisma/ci.db-shm
          rm -f apps/api/prisma/ci.db-wal

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Web
        run: pnpm --filter web typecheck

      - name: Run Web tests
        run: pnpm --filter web test

      - name: Build Web
        run: pnpm --filter web build

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build
