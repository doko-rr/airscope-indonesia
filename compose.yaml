name: airscope-indonesia

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: airscope-api:local
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: file:/data/airscope.db
      FRONTEND_URL: http://localhost:3000
      MQTT_ENABLED: 'false'
      MQTT_URL: mqtt://mqtt:1883
      MQTT_CLIENT_ID: airscope-api
      MQTT_TOPIC_PREFIX: airscope/v1
    ports:
      - '4000:4000'
    volumes:
      - airscope-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    image: airscope-web:local
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:4000/api/v1
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  airscope-data:
